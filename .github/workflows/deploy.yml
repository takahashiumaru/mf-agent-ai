name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH Deploy & Run
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            TARGET_DIR="/home/ubuntu/mf-agent-ai"

            # 1. Cek jika folder repo belum ada di /home/ubuntu/mf-agent-ai, lakukan clone
            if [ ! -d "$TARGET_DIR" ]; then
              echo "==> Folder $TARGET_DIR tidak ditemukan di server. Melakukan git clone..."
              git clone https://github.com/takahashiumaru/mf-agent-ai.git "$TARGET_DIR"
              cd "$TARGET_DIR"

              # Buat .env default jika belum ada
              if [ ! -f ".env" ] && [ -f ".env.example" ]; then
                cp .env.example .env
                echo "==> File .env telah disiapkan dari .env.example di $TARGET_DIR"
              fi
            else
              echo "==> Folder $TARGET_DIR ditemukan. Mengambil update terbaru (git pull)..."
              cd "$TARGET_DIR"
              git pull origin main
            fi

            # 2. Build dan jalankan container
            echo "==> Menjalankan Docker Compose di $TARGET_DIR..."
            docker compose up -d --build

            echo "==> ✅ Deploy selesai dan container aktif di /home/ubuntu/mf-agent-ai!"
