services:
  mf-agent-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mf-agent-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - AGENT_MODE=api
    volumes:
      - mf_agent_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  sonarqube:
    image: sonarqube:lts-community
    container_name: mf-agent-ai-sonarqube
    restart: unless-stopped
    environment:
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Xmx1024m -Xms512m"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  mf_agent_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
